<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Birthday Countdown | shelkeaditya</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="app">
      <div class="wrapper">

        <!-- Header -->
        <div class="header">
          <span class="branding">shelkeaditya</span>

          <span class="overline">Counting down to</span>

          <h1>Aditya's Birthday</h1>

          <span class="birthday-line">{{ birthdayLine }}</span>
        </div>

        <!-- Countdown -->
        <div class="countdown-grid">

          <div class="countdown-block">
            <span class="number">
              <span
                class="digit-wrap"
                v-for="(digit, i) in daysDigits"
                :key="'days-' + i"
              >
                <transition name="dial">
                  <span class="digit-face" :key="digit">{{ digit }}</span>
                </transition>
              </span>
            </span>
            <span class="label">Days</span>
          </div>

          <div class="countdown-block">
            <span class="number">
              <span
                class="digit-wrap"
                v-for="(digit, i) in hoursDigits"
                :key="'hours-' + i"
              >
                <transition name="dial">
                  <span class="digit-face" :key="digit">{{ digit }}</span>
                </transition>
              </span>
            </span>
            <span class="label">Hours</span>
          </div>

          <div class="countdown-block">
            <span class="number">
              <span
                class="digit-wrap"
                v-for="(digit, i) in minutesDigits"
                :key="'minutes-' + i"
              >
                <transition name="dial">
                  <span class="digit-face" :key="digit">{{ digit }}</span>
                </transition>
              </span>
            </span>
            <span class="label">Minutes</span>
          </div>

          <div class="countdown-block">
            <span class="number">
              <span
                class="digit-wrap"
                v-for="(digit, i) in secondsDigits"
                :key="'seconds-' + i"
              >
                <transition name="dial">
                  <span class="digit-face" :key="digit">{{ digit }}</span>
                </transition>
              </span>
            </span>
            <span class="label">Seconds</span>
          </div>

        </div>

        <!-- Year Progress -->
        <div class="progress-wrap">

          <div class="progress-meta">
            <span class="progress-label">Year progress</span>
            <span class="progress-pct">{{ yearProgress }}%</span>
          </div>

          <div class="progress-track">

            <div
              class="progress-fill"
              :style="{ width: yearProgress + '%' }"
            ></div>

            <div
              class="progress-marker"
              :style="{ left: yearProgress + '%' }"
            ></div>

          </div>

        </div>

        <!-- Timezones -->
        <div class="timezone-info">

          <!-- Global Time -->
          <div class="tz-item">
            <span class="tz-label">UTC</span>
            <span class="tz-value">{{ utcDate }}</span>
          </div>

          <div class="tz-divider"></div>

          <!-- My Time -->
          <div class="tz-item">
            <span class="tz-label">IST</span>
            <span class="tz-value">{{ myDate }}</span>
          </div>

          <div class="tz-divider"></div>

          <!-- Your Time -->
          <div class="tz-item">
            <span class="tz-label">{{ visitorTimezone }}</span>
            <span class="tz-value">{{ yourDate }}</span>
          </div>

        </div>

      </div>
    </div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Application -->
    <script src="app.js"></script>

  </body>
</html>
